; ============================================================
; Zio language file - English (base reference)
; Format: INI. Lines starting with ; or # are comments.
; [Section] prefixes every key below it, e.g. [names.modules]
;   plus Sprint produces the key "names.modules.Sprint".
; Wrap values in double quotes to keep leading/trailing spaces.
; Use \n for a line break, <red> or <yellow> for coloured text.
;
; NOTE: English is the fallback language. Any key missing here is
; resolved to the built-in English name exported by the code, so this
; file only needs to override what differs from the source strings.
; Keep the key set identical to zh_cn.ini when translating a new string.
; ============================================================

[names.categories]
Combat = Combat
Movement = Movement
Render = Render
Player = Player
Misc = Misc
Exploit = Exploit
Client = Client
HUD = HUD

[names.modules]
UI = UI
Fonts = Fonts

[descriptions.modules]
NoHitDelay = "Removes the weapon attack delay. \n<red>Only works on pre 1.9 servers."
