; ============================================================
; Zio 语言文件 - 简体中文 (zh_cn.ini)
;
; 汉化作者: 9407-guangchenyi
; 项目地址: https://github.com/9407-guangchenyi
; 版本: 1.0
; 日期: 2026-11-14
;
; 说明:
;   本文件为 Zio 客户端的简体中文本地化。
;   译名参考 Astra-Daily 1.0 的模块中英文对照表，
;   并统一了大量术语（EnderCrystal=末地水晶, Obsidian=黑曜石 等）。
;
; 覆盖范围:
;   - 面板分类      8 条
;   - 模块显示名  202 条
;   - 设置项名称  926 条
;   - 模块描述    176 条
;   - 合计       1312 条
;
; 格式：INI。以 ; 或 # 开头的行是注释。
; [节名] 会为下面所有键加上前缀：
;   [names.modules] + Sprint  =>  "names.modules.Sprint"
; 键名必须与 en_us.ini 完全一致，只翻译等号右边的值。
; 用 \n 表示换行，<red> / <yellow> 表示彩色文字。
; ============================================================

